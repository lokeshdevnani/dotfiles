onboarding = false

[ui]
status_indicators = "symbols"

[ui.toast]
delivery = "system"

[theme]
name = "catppuccin"
auto_switch = false

[keys]
# Option+h/j/k/l moves between panes without the prefix (left Option only)
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]
