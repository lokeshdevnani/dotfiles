# ---------- Font ----------
font_family      family="Anka/Coder"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15.0
adjust_line_height 110%
disable_ligatures cursor
# ---------- Look ----------
cursor_shape          beam
cursor_blink_interval 0
window_padding_width  6 10
hide_window_decorations no
macos_titlebar_color  background
background_opacity    1.0
inactive_text_alpha   0.75
draw_minimal_borders  yes
window_border_width   1pt

tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title[title.rfind('/')+1:]}"
tab_bar_min_tabs      1

# ---------- Behaviour ----------
scrollback_lines          20000
scrollback_pager_history_size 100
copy_on_select            yes
strip_trailing_spaces     smart
enable_audio_bell         no
visual_bell_duration      0
confirm_os_window_close   -1
macos_option_as_alt       left
macos_quit_when_last_window_closed yes
macos_show_window_title_in none
shell_integration         enabled
allow_remote_control      socket-only
listen_on                 unix:/tmp/kitty
remember_window_size      yes
enabled_layouts           splits,stack,tall

# ---------- Keys ----------
# Text editing (macOS-style). Option+arrows/delete send kitty's native codes;
# zsh word movement for them is bound in ~/.zshrc.
map cmd+left        send_text all \x01
map cmd+right       send_text all \x05
map cmd+backspace   send_text all \x15
map cmd+z           send_text all \x1f

# Splits (open in current directory)
map cmd+d           launch --location=vsplit --cwd=current
map cmd+shift+d     launch --location=hsplit --cwd=current
map cmd+enter       launch --location=split --cwd=current
map cmd+w           close_window
map cmd+shift+enter toggle_layout stack

# Move between splits
map cmd+alt+left    neighboring_window left
map cmd+alt+right   neighboring_window right
map cmd+alt+up      neighboring_window up
map cmd+alt+down    neighboring_window down

# Rearrange / resize splits
map cmd+shift+left  move_window left
map cmd+shift+right move_window right
map cmd+shift+up    move_window up
map cmd+shift+down  move_window down
map cmd+r           start_resizing_window
map cmd+shift+r     layout_action rotate

# Tabs
map cmd+t           new_tab_with_cwd
map cmd+shift+w     close_tab
map cmd+shift+[     previous_tab
map cmd+shift+]     next_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab -1

# Search scrollback with fzf
map cmd+f launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i --tac

# Open last command's output in a pager
map cmd+shift+o show_last_command_output

# Jump to previous/next prompt
map cmd+up   scroll_to_prompt -1
map cmd+down scroll_to_prompt 1

# Hints: pick & open URLs / copy paths / hashes on screen
map cmd+shift+u open_url_with_hints

# herdr captures the mouse; Cmd+click still opens links
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left press   grabbed,ungrabbed discard_event

# Plain-text paths in agent output aren't links: Cmd+Shift+click or Cmd+Shift+E opens.
# Relative paths resolve against the focused herdr pane's cwd; a trailing :42 is ignored. Everything opens with macOS `open`.
mouse_map cmd+shift+left press   grabbed,ungrabbed combine : mouse_selection word : launch --type=background /Users/lokeshdevnani/.config/kitty/open-path.sh @selection
mouse_map cmd+shift+left release grabbed,ungrabbed discard_event
map cmd+shift+e kitten hints --type path --program /Users/lokeshdevnani/.config/kitty/open-path.sh
# Select something with the mouse (herdr copies it), then Cmd+O opens it: a path (searched for if relative) or URL
map cmd+o       launch --type=background /Users/lokeshdevnani/.config/kitty/open-path.sh --clip
map cmd+shift+p kitten hints --type path --program @
map cmd+shift+h kitten hints --type hash --program @
map cmd+shift+l kitten hints --type line --program @

# Font size
map cmd+equal  change_font_size all +1.0
map cmd+minus  change_font_size all -1.0
map cmd+0      change_font_size all 0

# Config
map cmd+,       edit_config_file
map cmd+shift+, load_config_file

# Cycle through splits in the current tab
map cmd+]           next_window
map cmd+[           previous_window

# ---------- herdr windows ----------
# When the focused window runs herdr (zsh function sets var in_herdr, see ~/.zshrc), Cmd shortcuts drive herdr (prefix ctrl+b = \x02)
# instead of kitty tabs/splits. These come after the kitty mappings above and win only
# in herdr windows; plain kitty windows keep the kitty behaviour.
map --when-focus-on var:in_herdr cmd+t           send_text all \x02c
map --when-focus-on var:in_herdr cmd+shift+[     send_text all \x02p
map --when-focus-on var:in_herdr cmd+shift+]     send_text all \x02n
map --when-focus-on var:in_herdr cmd+1           send_text all \x021
map --when-focus-on var:in_herdr cmd+2           send_text all \x022
map --when-focus-on var:in_herdr cmd+3           send_text all \x023
map --when-focus-on var:in_herdr cmd+4           send_text all \x024
map --when-focus-on var:in_herdr cmd+5           send_text all \x025
map --when-focus-on var:in_herdr cmd+6           send_text all \x026
map --when-focus-on var:in_herdr cmd+7           send_text all \x027
map --when-focus-on var:in_herdr cmd+8           send_text all \x028
map --when-focus-on var:in_herdr cmd+9           send_text all \x029
map --when-focus-on var:in_herdr cmd+d           send_text all \x02v
map --when-focus-on var:in_herdr cmd+shift+d     send_text all \x02-
map --when-focus-on var:in_herdr cmd+w           send_text all \x02x
map --when-focus-on var:in_herdr cmd+shift+w     send_text all \x02X
map --when-focus-on var:in_herdr cmd+shift+enter send_text all \x02z
map --when-focus-on var:in_herdr cmd+r           send_text all \x02r
map --when-focus-on var:in_herdr cmd+alt+left    send_text all \x02h
map --when-focus-on var:in_herdr cmd+alt+down    send_text all \x02j
map --when-focus-on var:in_herdr cmd+alt+up      send_text all \x02k
map --when-focus-on var:in_herdr cmd+alt+right   send_text all \x02l
map --when-focus-on var:in_herdr cmd+]           send_text all \x02\t
map --when-focus-on var:in_herdr cmd+[           send_text all \x02\x1b[Z
